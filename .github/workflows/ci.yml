name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Analyze example
        run: cd example && flutter analyze
      - name: Test package
        run: flutter test
      - name: Test example
        run: cd example && flutter test

  macos-native-warnings:
    name: macOS native warnings (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [spm, pods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          pod --version
          flutter --version
      - name: Build the example and fail on any Xcode, clang, swiftc or linker warning
        run: bash tool/check_macos_native_warnings.sh ${{ matrix.variant }}

  macos-native-tests:
    name: macOS native unit tests (XCTest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Flutter build files
        working-directory: example
        run: |
          flutter pub get
          flutter build macos --config-only
      - name: Run RunnerTests
        working-directory: example/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' 2>&1 | tee "$RUNNER_TEMP/xctest.log" \
            | grep -E "Test Case|Test Suite|Executed|TEST (SUCCEEDED|FAILED)|error:|warning:"
