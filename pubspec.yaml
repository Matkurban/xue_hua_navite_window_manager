name: xue_hua_navite_window_manager
description: "High-performance cross-platform desktop window manager plugin for Flutter (macOS, Windows, Linux) with zero-flash startup, atomic configuration, custom frameless window & DWM shadow/Snap Layouts, and macOS traffic lights positioning."
version: 1.0.2
homepage: https://github.com/Matkurban/xue_hua_navite_window_manager
repository: https://github.com/Matkurban/xue_hua_navite_window_manager
issue_tracker: https://github.com/Matkurban/xue_hua_navite_window_manager/issues

topics:
  - window
  - desktop
  - window-manager
  - titlebar
  - frameless

screenshots:
  - description: 'XueHua Native Window Manager Studio on Windows — live geometry telemetry, atomic presets, and event stream.'
    path: screenshots/windows_studio.png
  - description: 'Studio controls on Windows — title bar styles, behavior chips, DragArea, and lifecycle actions.'
    path: screenshots/windows_studio_controls.png
  - description: 'XueHua Native Window Manager Studio on Linux — live telemetry, atomic presets, and native event stream.'
    path: screenshots/linux_studio.png

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: XueHuaNaviteWindowManagerPlugin
      macos:
        pluginClass: XueHuaNaviteWindowManagerPlugin
      windows:
        pluginClass: XueHuaNaviteWindowManagerPluginCApi
