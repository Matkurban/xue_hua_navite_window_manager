name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Analyze example
        run: cd example && flutter analyze
      - name: Test package
        run: flutter test
      - name: Test example
        run: cd example && flutter test

  macos-native-warnings:
    name: macOS native warnings (${{ matrix.check }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: ['example', 'plugin podspec', 'pods', 'self-test']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          pod --version
          flutter --version
      - name: Fail on any Xcode, clang, swiftc or linker warning
        run: bash tool/check_macos_native_warnings.sh ${{ matrix.check }}

  macos-native-tests:
    name: macOS native unit tests (XCTest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Flutter build files
        working-directory: example
        run: |
          flutter pub get
          flutter build macos --config-only
      - name: Run RunnerTests
        working-directory: example/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" 2>&1 | tee "$RUNNER_TEMP/xctest.log" \
            | grep -E "Test Case|Test Suite|Executed|TEST (SUCCEEDED|FAILED)|error:|warning:"

  integration-macos:
    name: Integration tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run integration tests
        working-directory: example
        run: flutter test integration_test -d macos -r expanded

  integration-windows:
    name: Integration tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run integration tests
        working-directory: example
        run: flutter test integration_test -d windows -r expanded

  integration-linux:
    name: Integration tests (Linux, Xvfb + openbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies, Xvfb and a window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-14-dev \
            xvfb openbox libgl1-mesa-dri libegl1
      # Flutter's documentation runs Linux integration tests under xvfb-run. A
      # bare Xvfb has no window manager, which maximize, minimize, fullscreen
      # and focus need, so openbox runs next to it and the tests are told to
      # fail (rather than skip) if it is missing.
      - name: Run integration tests
        working-directory: example
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            openbox &
            sleep 2
            flutter test integration_test -d linux -r expanded \
              --dart-define=XUE_HUA_REQUIRE_WINDOW_MANAGER=true
          '
